[package]
name = "serialflux-mcp"
version = "0.1.6"
edition = "2021"
description = "Standalone Rust MCP server for Serial Flux"
license = "MIT"

[dependencies]
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time"] }
serde_json = "1"

serde = { version = "1", features = ["derive"] }
